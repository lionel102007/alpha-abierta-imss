<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Integridad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- BANNER -->
<div class="banner">
  <img src="img/banner.jpg">
</div>

<!-- MENU -->
<div id="menu-container"></div>

<!-- HEADER -->
<section class="header-verde">

  <h1 id="titulo-integridad"></h1>

</section>

<!-- CONTENIDO -->
<section class="contenido-integridad">

  <h2 class="subtitulo" id="subtitulo-integridad"></h2>

  <p class="alerta" id="descripcion-integridad"></p>

  <!-- IMAGENES -->
  <div class="contenedor-imagenes" id="imagenes-integridad">
  </div>

  <div class="linea"></div>

  <div class="info-integridad">

    <h2>Objetivos</h2>

    <p id="objetivos-integridad"></p>

    <h2>Importancia</h2>

    <p id="importancia-integridad"></p>

  </div>

</section>

<!-- BOTON -->
<div style="margin:30px; text-align:center;">
  <a href="index.html" class="boton">← Regresar</a>
</div>

<footer>
  <p>© 2026 IMSS</p>
</footer>

<script src="js/menu.js"></script>

<script>

fetch('./datos/integridad.json')

.then(response => response.json())

.then(data => {

  /* TITULO */
  document.getElementById("titulo-integridad")
    .textContent = data.titulo;

  /* SUBTITULO */
  document.getElementById("subtitulo-integridad")
    .textContent = data.subtitulo;

  /* DESCRIPCION */
  document.getElementById("descripcion-integridad")
    .textContent = data.descripcion;

  /* OBJETIVOS */
  document.getElementById("objetivos-integridad")
    .textContent = data.objetivos;

  /* IMPORTANCIA */
  document.getElementById("importancia-integridad")
    .textContent = data.importancia;

  /* IMAGENES */
  const imagenes = document.getElementById("imagenes-integridad");

  data.imagenes.forEach(img => {

    imagenes.innerHTML += `
      <img src="${img}">
    `;

  });

})

.catch(error => console.log(error));

</script>

</body>
</html>
