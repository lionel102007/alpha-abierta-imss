<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ECCO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- BANNER -->
<div class="banner">
  <img src="img/banner.jpg">
</div>

<!-- MENU -->
<div id="menu-container"></div>

<!-- HEADER ECCO -->
<header class="header-ecco">

  <img id="banner-ecco" src="">

</header>

<!-- CONTENIDO -->
<section class="contenido-ecco">

  <h1 id="titulo-ecco"></h1>

  <p id="descripcion-ecco"></p>

  <!-- IMAGENES -->
  <div class="contenedor-imagenes" id="imagenes-ecco">
  </div>

  <h2>Objetivos</h2>

  <p id="objetivos-ecco"></p>

  <h2>Historia</h2>

  <p id="historia-ecco"></p>

</section>

<!-- BOTON -->
<div style="margin:30px; text-align:center;">
  <a href="index.html" class="boton">← Regresar</a>
</div>

<footer>
  <p>© 2026 IMSS</p>
</footer>

<script src="js/menu.js"></script>

<script>

fetch('./datos/ecco.json')

.then(response => response.json())

.then(data => {

  /* TITULO */
  document.getElementById("titulo-ecco")
    .textContent = data.titulo;

  /* DESCRIPCION */
  document.getElementById("descripcion-ecco")
    .textContent = data.descripcion;

  /* OBJETIVOS */
  document.getElementById("objetivos-ecco")
    .textContent = data.objetivos;

  /* HISTORIA */
  document.getElementById("historia-ecco")
    .textContent = data.historia;

  /* BANNER */
  document.getElementById("banner-ecco")
    .src = data.banner;

  /* IMAGENES */
  const imagenes = document.getElementById("imagenes-ecco");

  data.imagenes.forEach(img => {

    imagenes.innerHTML += `
      <img src="${img}">
    `;

  });

})

.catch(error => console.log(error));

</script>

</body>
</html>
