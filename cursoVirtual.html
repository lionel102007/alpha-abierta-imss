<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Curso Virtual - IMSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="banner">
    <img src="img/banner.jpg">
  </div>

  <div id="menu-container"></div>

  <section class="header-verde">
    <h1>CURSOS BUEN GOBIERNO</h1>
    <p>Obligatorios para servidores públicos.</p>
  </section>

  <section class="acceso">
    <a id="link-sicavi" class="link-grande">Cargando...</a>

    <div class="botones">
      <a id="link-admin" class="boton">Cargando...</a>
      <a id="link-etica" class="boton">Cargando...</a>
    </div>
  </section>

  <section class="plataformas">
    <div class="plataforma">
      <h2>SICAVISP</h2>
      <a id="link-sicavisp">Cargando...</a><br><br>
      <a id="btn-sicavisp" class="boton">Ir</a>
    </div>

    <div class="plataforma">
      <h2>@prende.mx</h2>
      <a id="link-aprende">Cargando...</a><br><br>
      <a id="btn-aprende" class="boton">Ir</a>
    </div>
  </section>

  <div style="margin: 30px;">
    <a href="index.html" class="boton">← Regresar</a>
  </div>

  <footer>
    <p>© 2026 IMSS</p>
  </footer>

  <script src="js/menu.js"></script>

  <script>
  fetch("datos/cursoVirtual.json")
    .then(res => res.json())
    .then(data => {

      document.getElementById("link-sicavi").href = data.sicavi.url;
      document.getElementById("link-sicavi").textContent = data.sicavi.texto;

      document.getElementById("link-admin").href = data.admin.url;
      document.getElementById("link-admin").textContent = data.admin.texto;

      document.getElementById("link-etica").href = data.etica.url;
      document.getElementById("link-etica").textContent = data.etica.texto;

      document.getElementById("link-sicavisp").href = data.sicavisp.url;
      document.getElementById("link-sicavisp").textContent = data.sicavisp.texto;
      document.getElementById("btn-sicavisp").href = data.sicavisp.url;

      document.getElementById("link-aprende").href = data.aprende.url;
      document.getElementById("link-aprende").textContent = data.aprende.texto;
      document.getElementById("btn-aprende").href = data.aprende.url;

    });
  </script>

</body>
</html>
