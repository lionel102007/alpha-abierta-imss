<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Cursos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- BANNER -->
<div class="banner">
  <img src="img/banner.jpg">
</div>

<!-- MENU -->
<div id="menu-container"></div>

<!-- HEADER -->
<section class="header-verde">

  <h1 id="titulo-catalogo"></h1>

  <p id="descripcion-catalogo"></p>

</section>

<!-- BOTONES -->
<section class="documentos">

  <div class="contenedor-docs" id="contenedor-cursos">
  </div>

</section>

<!-- BOTON -->
<div style="margin:30px; text-align:center;">
  <a href="index.html" class="boton">← Regresar</a>
</div>

<footer>
  <p>© 2026 IMSS</p>
</footer>

<script src="js/menu.js"></script>

<script>

fetch('./datos/catalogo.json')

.then(response => response.json())

.then(data => {

  /* TITULO */
  document.getElementById("titulo-catalogo")
    .textContent = data.titulo;

  /* DESCRIPCION */
  document.getElementById("descripcion-catalogo")
    .textContent = data.descripcion;

  /* CURSOS */
  const contenedor =
    document.getElementById("contenedor-cursos");

  data.cursos.forEach(curso => {

    contenedor.innerHTML += `

      <a href="${curso.pdf}"
         target="_blank"
         class="doc"
         style="background:${curso.color}; color:white;">

         📘 ${curso.nombre}

      </a>

    `;

  });

})

.catch(error => console.log(error));

</script>

</body>
</html>
