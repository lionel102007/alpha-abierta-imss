<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Servicio Social</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- BANNER -->
<div class="banner">
  <img src="img/banner.jpg">
</div>

<!-- MENU -->
<div id="menu-container"></div>

<!-- HEADER -->
<section class="header-verde">

  <h1 id="titulo-servicio"></h1>

</section>

<!-- CONTENIDO -->
<section class="contenido-servicio">

  <p id="descripcion-servicio"></p>

  <br>

  <p id="informacion-servicio"></p>

  <!-- IMAGENES -->
  <div class="contenedor-imagenes" id="imagenes-servicio">
  </div>

  <h2 style="margin-top:30px;">
    Requisitos
  </h2>

  <!-- REQUISITOS -->
  <ul class="lista-servicio" id="lista-servicio">
  </ul>

</section>

<!-- DOCUMENTOS -->
<section class="documentos">

  <h2>Documentos</h2>

  <div class="contenedor-docs" id="docs-servicio">
  </div>

</section>

<!-- BOTON -->
<div style="margin:30px; text-align:center;">
  <a href="index1.html" class="boton">← Regresar</a>
</div>

<footer>
  <p>© 2026 IMSS</p>
</footer>

<script src="js/menu.js"></script>

<script>

fetch('./datos/servicio-social.json')

.then(response => response.json())

.then(data => {

  /* TITULO */
  document.getElementById("titulo-servicio")
    .textContent = data.titulo;

  /* DESCRIPCION */
  document.getElementById("descripcion-servicio")
    .textContent = data.descripcion;

  /* INFORMACION */
  document.getElementById("informacion-servicio")
    .textContent = data.informacion;

  /* IMAGENES */
  const imagenes =
    document.getElementById("imagenes-servicio");

  data.imagenes.forEach(img => {

    imagenes.innerHTML += `
      <img src="${img}">
    `;

  });

  /* REQUISITOS */
  const lista =
    document.getElementById("lista-servicio");

  data.requisitos.forEach(req => {

    lista.innerHTML += `
      <li>${req}</li>
    `;

  });

  /* DOCUMENTOS */
  const docs =
    document.getElementById("docs-servicio");

  data.documentos.forEach(doc => {

    docs.innerHTML += `

      <a href="${doc.pdf}"
         target="_blank"
         class="doc">

         📄 ${doc.titulo}

      </a>

    `;

  });

})

.catch(error => console.log(error));

</script>

</body>
</html>
