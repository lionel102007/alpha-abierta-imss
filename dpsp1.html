<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DPSP - IMSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="banner">
    <img src="img/banner.jpg">
  </div>

  <div id="menu-container"></div>

  <section class="inicio">
    <h1>DPSP</h1>
    <p>Programa para concluir estudios.</p>
    <a href="index.html" class="boton">← Regresar</a>
  </section>

  <section class="cursos">
    <h2>Opciones educativas</h2>
    <div id="contenedor-dpsp"></div>
  </section>

  <footer>
    <p>© 2026 IMSS</p>
  </footer>

  <script src="js/menu.js"></script>

  <script>
  fetch("datos/dpsp.json")
    .then(res => res.json())
    .then(data => {
      const contenedor = document.getElementById("contenedor-dpsp");

      data.programas.forEach(p => {
        const card = document.createElement("div");
        card.classList.add("card");

        card.innerHTML = `
          <img src="${p.imagen}">
          <h3>${p.nivel}</h3>
          <p>${p.institucion}</p>
        `;

        card.onclick = () => {
          window.open(p.link, "_blank");
        };

        contenedor.appendChild(card);
      });
    });
  </script>

</body>
</html>
