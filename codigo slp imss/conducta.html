<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Código de Conducta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- BANNER -->
<div class="banner">
  <img src="img/banner.jpg">
</div>

<!-- MENU -->
<div id="menu-container"></div>

<!-- HEADER -->
<section class="header-verde">

  <h1 id="titulo-conducta"></h1>

</section>

<!-- CONTENIDO -->
<section class="contenido-conducta">

  <p class="descripcion" id="descripcion-conducta"></p>

  <!-- IMÁGENES -->
  <div class="contenedor-imagenes" id="imagenes-conducta">
  </div>

</section>

<!-- DOCUMENTOS -->
<section class="documentos">

  <h2>Documentos</h2>

  <div class="contenedor-docs" id="docs-conducta">
  </div>

</section>

<!-- BOTÓN -->
<div style="margin:30px; text-align:center;">
  <a href="index1.html" class="boton">← Regresar</a>
</div>

<footer>
  <p>© 2026 IMSS</p>
</footer>

<script src="js/menu.js"></script>

<script>

fetch('./datos/conducta.json')

.then(response => response.json())

.then(data => {

  /* TITULO */
  document.getElementById("titulo-conducta")
    .textContent = data.titulo;

  /* DESCRIPCION */
  document.getElementById("descripcion-conducta")
    .textContent = data.descripcion;

  /* IMAGENES */
  const imagenes = document.getElementById("imagenes-conducta");

  data.imagenes.forEach(img => {

    imagenes.innerHTML += `
      <img src="${img}">
    `;

  });

  /* DOCUMENTOS */
  const docs = document.getElementById("docs-conducta");

  data.documentos.forEach(doc => {

    docs.innerHTML += `

      <a href="${doc.pdf}" target="_blank" class="doc">
        📄 ${doc.titulo}
      </a>

    `;

  });

})

.catch(error => console.log(error));

</script>

</body>
</html>
